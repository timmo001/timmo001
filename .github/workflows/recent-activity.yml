---
name: 👩‍💻 Update Recent Activity

on:
  schedule:
    - cron: "0 */6 * * *" # Run every 6 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recent-activity

jobs:
  build:
    runs-on: ubuntu-latest
    name: Update RECENT-ACTIVITY.md with recent activity

    steps:
      - name: ↘️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: ↗️ Update activity log
        uses: lissy93/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MSG: "⚡ Update recent activity"
        with:
          MAX_LINES: 100
          TARGET_FILE: "./RECENT-ACTIVITY.md"
